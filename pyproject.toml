[tool.poetry]
name = "opensesame-plugin-radboudbox"
version = "5.4.3"
description = "OpenSesame plugin for the Radboud Buttonbox (BITSI): button responses, sound and voice key, and triggers"
authors = ["Bob Rosbag <mail@bobrosbag.nl>"]
readme = "README.md"
packages = [
    {include = "opensesame_plugins"},
]
license = "GPL-3.0-or-later"
homepage = "https://github.com/dev-jam/opensesame-plugin-radboudbox"
repository = "https://github.com/dev-jam/opensesame-plugin-radboudbox"

[tool.poetry.dependencies]
python = ">= 3.10"
rusocsci = "*"
pyserial = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
